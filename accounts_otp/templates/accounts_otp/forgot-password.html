<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فراموشی رمز عبور | نازاستور</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #004cff 0%, #6b9fff 50%, #f0f4ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            padding: 20px;
        }

        .form {
            background: linear-gradient(135deg, #ffffff 0%, #f8faff 100%);
            padding: 40px 35px;
            border-radius: 32px;
            width: 450px;
            max-width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .form-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #004cff, #6b9fff);
            border-radius: 22px;
            padding: 15px;
            display: inline-block;
        }

        .form-title {
            color: #1a2a4f;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .form-subtitle {
            color: #6a7c9f;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #1a2a4f;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e6f0;
            border-radius: 14px;
            font-size: 1rem;
            transition: all 0.3s;
            text-align: left;
            direction: ltr;
        }

        .input-group input:focus {
            outline: none;
            border-color: #004cff;
            box-shadow: 0 0 0 3px rgba(0, 76, 255, 0.1);
        }

        .button-submit {
            background: linear-gradient(135deg, #004cff, #006eff);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .button-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 76, 255, 0.4);
        }

        .alert {
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-right: 4px solid #4caf50;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border-right: 4px solid #f44336;
        }

        .back-link {
            margin-top: 20px;
            display: block;
        }

        .back-link a {
            color: #6a7c9f;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .back-link a:hover {
            color: #004cff;
        }
    </style>
</head>
<body>
<div class="form">
    <div class="form-logo">
        <svg width="45" height="45" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="1.5"/>
            <path d="M2 17L12 22L22 17" stroke="white" stroke-width="1.5"/>
            <path d="M2 12L12 17L22 12" stroke="white" stroke-width="1.5"/>
        </svg>
    </div>
    <h2 class="form-title">🔐 فراموشی رمز عبور</h2>
    <p class="form-subtitle">شماره تلفن خود را وارد کنید</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="input-group">
            <label>📱 شماره تلفن</label>
            <input type="tel" name="phone" placeholder="09123456789" required pattern="[0-9]{11}" maxlength="11">
        </div>
        <button class="button-submit" type="submit">ارسال کد تایید</button>
    </form>

    <div class="back-link">
        <a href="{% url 'accounts_app:login' %}">← بازگشت به صفحه ورود</a>
    </div>
</div>
</body>
<style>
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s;
    }

    .loading-logo {
        width: 100px;
        animation: pulse 1.5s infinite;
    }

    .loading-dots {
        display: flex;
        gap: 12px;
        margin-top: 20px;
    }

    .loading-dots span {
        width: 12px;
        height: 12px;
        background: #004cff;
        border-radius: 50%;
        animation: bounce 0.8s infinite;
    }

    .loading-dots span:nth-child(1) {
        animation-delay: 0s;
    }

    .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
            opacity: 0.5;
        }
        50% {
            transform: translateY(-15px);
            opacity: 1;
        }
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.05);
        }
    }

    .loading-text {
        margin-top: 20px;
        color: #004cff;
        font-size: 14px;
    }
</style>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
        <img src="/static/images/logo/Kit.png.jpeg.png" alt="لوگو" class="loading-logo">
        <div class="loading-dots">
            <span></span><span></span><span></span>
        </div>
        <div class="loading-text">در حال بارگذاری...</div>
    </div>
</div>

<script>
    let loadingTimeout = null;

    function showLoading() {
        const loader = document.getElementById('loadingOverlay');
        if (loader) {
            loader.style.display = 'flex';
            loader.style.opacity = '1';
        }
    }

    function hideLoading() {
        const loader = document.getElementById('loadingOverlay');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }
    }

    // وقتی صفحه کامل لود شد، لودینگ رو مخفی کن
    window.addEventListener('load', function () {
        hideLoading();
    });

    // فقط برای لینک‌های داخلی (به جز دکمه بازگشت)
    document.addEventListener('click', function (e) {
        const link = e.target.closest('a');
        if (link && link.href && !link.href.startsWith('javascript:')) {
            // چک کردن اینکه لینک خارجی نیست
            const currentDomain = window.location.origin;
            if (link.href.startsWith(currentDomain) || link.href.startsWith('/')) {
                // جلوگیری از اجرا روی دکمه بازگشت (history.back)
                if (!link.hasAttribute('data-no-loading')) {
                    showLoading();
                }
            }
        }
    });

    // برای دکمه بازگشت مرورگر
    window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
            hideLoading();
        }
    });

    // برای popstate (وقتی کاربر با دکمه عقب/جلو میره)
    window.addEventListener('popstate', function () {
        hideLoading();
    });
</script>
</html>
