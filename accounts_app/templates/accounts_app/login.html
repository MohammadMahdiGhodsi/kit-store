<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | نازاستور</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #004cff 0%, #6b9fff 50%, #f0f4ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            padding: 20px;
            position: relative;
        }

        /* دایره‌های تزئینی پس زمینه */
        body::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 5%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: 10%;
            right: 5%;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            pointer-events: none;
        }

        .form {
            background: linear-gradient(135deg, #ffffff 0%, #f8faff 100%);
            padding: 40px 35px;
            border-radius: 32px;
            width: 480px;
            max-width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(0, 76, 255, 0.1);
        }

        .form:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 76, 255, 0.2);
        }

        /* هدر فرم */
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-logo {
            width: 90px;
            height: 90px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #004cff, #6b9fff);
            border-radius: 25px;
            padding: 18px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0, 76, 255, 0.3);
        }

        .form-title {
            color: #1a2a4f;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 15px 0 5px;
        }

        .form-subtitle {
            color: #6a7c9f;
            font-size: 0.85rem;
        }

        /* فیلدها */
        .flex-column {
            margin-bottom: 5px;
        }

        .flex-column label {
            font-weight: 600;
            color: #1a2a4f;
            margin-bottom: 8px;
            display: block;
            font-size: 0.85rem;
        }

        .inputForm {
            background-color: #f5f7fc;
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .inputForm:focus-within {
            border-color: #004cff;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(0, 76, 255, 0.1);
        }

        .inputForm svg {
            flex-shrink: 0;
        }

        .input-login {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.95rem;
            color: #1a2a4f;
            font-family: inherit;
        }

        .input-login::placeholder {
            color: #b0bed6;
        }

        /* دکمه ورود */
        .button-submit {
            background: linear-gradient(135deg, #004cff, #006eff);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .button-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 76, 255, 0.4);
        }

        /* لینک فراموشی رمز */
        .forgot-link {
            text-align: left;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-link a {
            color: #6a7c9f;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .forgot-link a:hover {
            color: #004cff;
        }

        /* لینک ثبت نام */
        .p {
            text-align: center;
            color: #6a7c9f;
            margin: 15px 0;
        }

        .span {
            color: #004cff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .span:hover {
            color: #0033cc;
            text-decoration: underline;
        }

        /* خط جداکننده */
        .line {
            position: relative;
            text-align: center;
            margin: 25px 0;
            color: #b0bed6;
            font-size: 0.85rem;
        }

        .line::before,
        .line::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #b0bed6, transparent);
        }

        .line::before {
            left: 0;
        }

        .line::after {
            right: 0;
        }

        /* دکمه‌های اجتماعی */
        .flex-row {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            border: 1.5px solid #e0e6f0;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a2a4f;
        }

        .btn:hover {
            border-color: #004cff;
            background: #f8faff;
            transform: translateY(-2px);
        }

        .google {
            color: #db4437;
        }

        .apple {
            color: #000;
        }

        /* پیام‌ها */
        .alert {
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85rem;
        }

        .alert-success {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            color: #2e7d32;
            border-right: 4px solid #4caf50;
        }

        .alert-error {
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            color: #c62828;
            border-right: 4px solid #f44336;
        }

        /* ریسپانسیو */
        @media (max-width: 550px) {
            .form {
                padding: 25px 20px;
            }

            .form-title {
                font-size: 1.5rem;
            }

            .flex-row {
                flex-direction: column;
            }

            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    {#        </svg>#}

    {#               required autocomplete="off"/>#}

<style>
    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s;
    }

    .loading-logo {
        width: 100px;
        animation: pulse 1.5s infinite;
    }

    .loading-dots {
        display: flex;
        gap: 12px;
        margin-top: 20px;
    }

    .loading-dots span {
        width: 12px;
        height: 12px;
        background: #004cff;
        border-radius: 50%;
        animation: bounce 0.8s infinite;
    }

    .loading-dots span:nth-child(1) {
        animation-delay: 0s;
    }

    .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
            opacity: 0.5;
        }
        50% {
            transform: translateY(-15px);
            opacity: 1;
        }
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.05);
        }
    }

    .loading-text {
        margin-top: 20px;
        color: #004cff;
        font-size: 14px;
    }
</style>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
        <img src="/static/images/logo/Kit.png.jpeg" alt="لوگو" class="loading-logo">
        <div class="loading-dots">
            <span></span><span></span><span></span>
        </div>
        <div class="loading-text">در حال بارگذاری...</div>
    </div>
</div>

<script>
    let loadingTimeout = null;

    function showLoading() {
        const loader = document.getElementById('loadingOverlay');
        if (loader) {
            loader.style.display = 'flex';
            loader.style.opacity = '1';
        }
    }

    function hideLoading() {
        const loader = document.getElementById('loadingOverlay');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }
    }

    // وقتی صفحه کامل لود شد، لودینگ رو مخفی کن
    window.addEventListener('load', function () {
        hideLoading();
    });

    // فقط برای لینک‌های داخلی (به جز دکمه بازگشت)
    document.addEventListener('click', function (e) {
        const link = e.target.closest('a');
        if (link && link.href && !link.href.startsWith('javascript:')) {
            // چک کردن اینکه لینک خارجی نیست
            const currentDomain = window.location.origin;
            if (link.href.startsWith(currentDomain) || link.href.startsWith('/')) {
                // جلوگیری از اجرا روی دکمه بازگشت (history.back)
                if (!link.hasAttribute('data-no-loading')) {
                    showLoading();
                }
            }
        }
    });

    // برای دکمه بازگشت مرورگر
    window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
            hideLoading();
        }
    });

    // برای popstate (وقتی کاربر با دکمه عقب/جلو میره)
    window.addEventListener('popstate', function () {
        hideLoading();
    });
</script>
</body>
</html>
